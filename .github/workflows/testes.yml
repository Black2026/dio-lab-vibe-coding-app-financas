name: Testes de lógica financeira
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar interpretação e cálculos
        run: node --test tests/finance-engine.test.cjs
